<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Hunyuan 3D accounts</h1>
    <button id="refresh" class="ghost" title="Check remaining generations of all accounts">↻ Check all</button>
  </header>
  <section id="access" hidden>
    <p>The extension needs access to <b>tencent.com</b> cookies (where the site keeps your login) to save and switch logins
    (Chrome's “Site access” is limited for this extension).</p>
    <button id="grant">Allow access</button>
  </section>
  <section id="current"></section>
  <ul id="list"></ul>
  <p id="empty" hidden>No saved accounts yet. Log in on the site, then click <b>Save current</b>.</p>
  <footer>
    <button id="save">Save current</button>
    <button id="add" class="ghost" title="Save the current login and sign out, so you can log in to another account">+ Add another</button>
  </footer>
  <div id="ask"></div>
  <p id="msg" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
